# ===========================================
# IMPS BACKEND – Application Configuration
# ===========================================
#
# CONNECTION PORTS (simple reference)
# -----------------------------------
#   IMPS:    HTTP 8081   HTTPS 8443   Socket TCP 9083   Socket TLS 9443
#   Switch:  HTTP 8082   HTTPS 8444   TCP 9084          TLS 9444
#   NPCI:    HTTP 8083   HTTPS 8445   TCP 9085          TLS 9445
# Default: socket uses TLS (ssl.enabled: true). Postman: HTTPS → https://192.168.1.38:8443/imps/reqpay/{{txnId}}
#
# For local dev with mocks: parent folder may contain mock_npci, mock_switch. Not required for production.
# Run: mvn spring-boot:run → HTTPS (ssl is default). For HTTP: -Dspring.profiles.active=default
#
# CONNECTION FLOW EXPLANATION:
# ===========================================
# FLOW 1: NPCI → IMPS → Switch → IMPS → NPCI (Request Flow)
# ---------------------------------------------------------
# Connection 1: NPCI connects to IMPS (socket) → sends Req → IMPS sends ACK → NPCI closes connection
# Connection 2: IMPS opens NEW connection to Switch (socket) → sends Req → Switch sends Resp → IMPS closes connection
# Connection 3: Switch opens NEW connection to IMPS (socket) → sends Resp → IMPS sends ACK → Switch closes connection
# Connection 4: IMPS opens NEW connection to NPCI (socket) → sends Resp → NPCI sends ACK → IMPS closes connection
#
# FLOW 2: Switch → IMPS → NPCI → IMPS → Switch (Reverse Flow)
# ---------------------------------------------------------
# Connection 1: Switch connects to IMPS (socket) → sends Req → IMPS sends Resp → Switch closes connection
# Connection 2: IMPS opens NEW connection to NPCI (socket) → sends Req → NPCI sends Resp → IMPS closes connection
# Connection 3: NPCI opens NEW connection to IMPS (socket) → sends Resp → IMPS sends ACK → NPCI closes connection
# Connection 4: IMPS opens NEW connection to Switch (socket) → sends Resp → Switch sends ACK → IMPS closes connection
#
# IMPORTANT: Each connection is opened, used, and closed immediately after use.
# Connections are NOT reused - new connection is opened for each message exchange.
#
# DEPLOYMENT WITH ACTUAL SWITCH AND NPCI
# --------------------------------------
# IMPS-backend is independent: it has no dependency on mock_switch or mock_npci.
# For production, set the following to your actual Switch and NPCI endpoints:
#   routing.switch.socket.host / port / ssl-enabled / trust-store  → actual Switch
#   routing.npci.base-url (if NPCI uses REST)                       → actual NPCI REST base URL
#   npci.socket.host / port (for outbound response to NPCI)         → actual NPCI socket
#   institution_master.switch_ip, switch_port (per bank)            → actual bank switch addresses
# Optional: set imps.heartbeat.switch-check-enabled: false if real Switch does not expose the same port for health checks.
# ===========================================

# ===========================================
# SERVER CONFIGURATION
# ===========================================
server:
  port: 8081

spring:
  application:
    name: Imps-backend
  # Default profile: ssl (HTTPS). Use -Dspring.profiles.active= (empty) or "default" for HTTP only.
  profiles:
    active: ssl
  datasource:
    url: jdbc:postgresql://localhost:5432/imps_db
    username: postgres
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# ===========================================
# CONNECTION FLOW CONFIGURATION
# ===========================================
# npci.compliant-flow: true
#   - NPCI connects → sends Req → IMPS ACK → NPCI closes connection
#   - Then IMPS opens NEW socket to NPCI → sends Resp → NPCI ACK → IMPS closes connection
#   - This ensures clean connection management (open → use → close)
#
# npci.compliant-flow: false
#   - Same socket: NPCI connects → sends Req → IMPS ACK → IMPS sends Resp → NPCI ACK → close
#   - NOT RECOMMENDED - use true for proper connection management
# ===========================================
npci:
  compliant-flow: true
  socket:
    host: 192.168.1.38
    port: 9445
    ssl-enabled: true
    trust-store: file:${user.dir}/../certs/imps-truststore.jks
    trust-store-password: IMPS-Backend
    connect-timeout-ms: 10000
    read-timeout-ms: 30000

# ===========================================
# ROUTING CONFIGURATION
# ===========================================
# Defines how IMPS routes messages between NPCI and Switch. Set to actual host/port for production.
# ===========================================
routing:
  # NPCI REST (used when NPCI sends request via HTTP; ACK and responses go to this base-url)
  npci:
    base-url: http://localhost:8083  # For dev: mock. For production: actual NPCI REST base URL
    endpoints:
      ack: /npci/ack
  
  # Switch Routing (socket: IMPS → Switch outbound; set host/port to actual Switch for production)
  switch:
    base-url: http://localhost:8082  # For dev: mock. For production: actual Switch HTTP base if used
    socket:
      enabled: true
      host: localhost   # For production: actual Switch host
      port: 9084        # TCP port (used when ssl-enabled: false)
      ssl-port: 9444    # TLS port (used when ssl-enabled: true; mock_switch listens here)
      ssl-enabled: true
      trust-store: file:${user.dir}/../certs/switch-truststore.jks
      trust-store-password: IMPS-Backend
    rest:
      enabled: false

# ===========================================
# SSL/TLS CONFIGURATION - NPCI Socket Server (Inbound)
# ===========================================
# When NPCI connects to IMPS, IMPS listens on these ports:
# - TCP: port 9083 (when ssl.enabled: false)
# - SSL/TLS: port 9443 (when ssl.enabled: true)
# ===========================================
ssl:
  enabled: true
  key-store: file:${user.dir}/../certs/imps-keystore.jks
  key-store-password: IMPS-Backend
  key-alias: imps
  trust-store: file:${user.dir}/../certs/imps-truststore.jks
  trust-store-password: IMPS-Backend
  client-auth: none

# ===========================================
# SOCKET SERVER CONFIGURATION
# ===========================================
# IMPS listens for incoming socket connections from NPCI and Switch
# ===========================================
socket:
  enabled: true                 # true = start socket servers
  server:
    bind-host: 0.0.0.0         # Listen on all interfaces
    # NPCI Socket Server (NPCI → IMPS)
    npci:
      port: 9083                # TCP port (used when ssl.enabled: false)
      ssl-port: 9443           # SSL/TLS port (used when ssl.enabled: true)
    # Switch Socket Server (Switch → IMPS reverse flow)
    switch:
      enabled: true             # true = listen for Switch connections
      port: 9086               # TCP port (used when ssl.enabled: false)
      ssl-port: 9446           # SSL/TLS port (used when ssl.enabled: true)
  max-xml-size: 1048576        # Max message size (1MB)
  response-timeout-seconds: 60  # Response timeout

# ===========================================
# IMPS API & HEARTBEAT CONFIGURATION
# ===========================================
imps:
  api:
    version: "2.1"
  # Startup banner and API base: host, protocol, port (all from here / server.port; console uses these)
  server:
    host: 192.168.1.38
    protocol: http
  org-id: BANK01
  # Fallback host/port when institution_master has null switch_ip/switch_port (edit here only; no env)
  routing:
    switch-default-host: localhost
    switch-default-port: 9084
  heartbeat:
    switch-check-enabled: true           # true = periodically check switch connectivity
    switch-check-interval-ms: 180000    # Check every 3 minutes
    switch-check-initial-delay-ms: 10000 # Start checking after 10 seconds
    # Ports that use SSL/TLS for switch connectivity checks
    switch-check-ssl-ports: 9444,9443,9445

# ===========================================
# PROFILE: ssl – REST over HTTPS
# ===========================================
# ssl is default in application.yml; use -Dspring.profiles.active=default for HTTP
# IMPS: 8443, Switch: 8444, NPCI mock: 8445
# ===========================================
---
spring:
  config:
    activate:
      on-profile: ssl
imps:
  server:
    protocol: https
server:
  port: 8443
  ssl:
    enabled: true
    key-store: file:${user.dir}/../certs/imps-keystore.jks
    key-store-password: IMPS-Backend
    key-store-type: PKCS12
    key-alias: imps

# When ssl profile is active, IMPS uses HTTPS for routing (set to actual URLs in production)
routing:
  npci:
    base-url: https://localhost:8445
  switch:
    base-url: https://localhost:8444

# ===========================================
# PROFILE: docker – cert paths for container
# ===========================================
# Use: java -Dspring.profiles.active=docker -jar app.jar
# Mount certs: -v ./certs:/app/certs
---
spring:
  config:
    activate:
      on-profile: docker
ssl:
  key-store: file:/app/certs/imps-keystore.jks
  trust-store: file:/app/certs/imps-truststore.jks
npci:
  socket:
    trust-store: file:/app/certs/imps-truststore.jks
routing:
  switch:
    socket:
      trust-store: file:/app/certs/switch-truststore.jks
# When ssl profile is also active (docker,ssl)
server:
  ssl:
    key-store: file:/app/certs/imps-keystore.jks
    trust-store: file:/app/certs/imps-truststore.jks
