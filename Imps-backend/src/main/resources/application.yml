# ===========================================
# IMPS BACKEND – Application configuration
# ===========================================
# HTTP (default): server.port 8081
# HTTPS: run with --spring.profiles.active=ssl → server.port 8443 (run certs/generate-certs.bat first)

# ===========================================
# FLAGS (true / false) – when each is used 
# ===========================================
# npci.compliant-flow
#   true  = NPCI connects → Req → IMPS ACK → NPCI closes; then IMPS opens NEW socket to NPCI → Resp → NPCI ACK
#   false = Same socket: read ACK then response on same connection
#
# routing.switch.socket.enabled   true = send to Switch via TCP socket; false = do not use socket
# routing.switch.rest.enabled     true = send to Switch via REST; false = do not use REST (socket default)
# ssl.enabled                     true = NPCI socket server uses TLS (ssl-port 9443); false = plain TCP (port 9083)
# npci.socket.ssl-enabled         true = IMPS connects to NPCI mock with TLS (e.g. 9445)
# routing.switch.socket.ssl-enabled  true = IMPS connects to Switch with TLS (e.g. 9444)
# imps.heartbeat.switch-check-enabled  true = ping each bank switch periodically and update institution_master.active

# ===========================================
# SERVER (HTTP default; HTTPS via profile 'ssl' below)
# ===========================================
server:
  port: 8081

spring:
  application:
    name: Imps-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/imps_db
    username: postgres
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# ===========================================
# ROUTING
# ===========================================
# NPCI → IMPS: {server.port}/imps/{reqtype}/{txn_id}
# IMPS → Switch: institution_master (switch_ip, switch_port) or fallback below (socket 9084 / 9444)
# Switch → IMPS: {server.port}/imps/{resptype}/{txn_id}
# IMPS → NPCI: routing.npci.base-url (REST) or npci.socket (when npci.compliant-flow: true)
# ===========================================

npci:
  compliant-flow: true
  socket:
    host: 192.168.1.38
    port: 9445
    ssl-enabled: true
    trust-store: E:\Hitachi_Project/IMPS-BACKEND/certs/imps-truststore.jks
    trust-store-password: IMPS-Backend
    connect-timeout-ms: 10000
    read-timeout-ms: 30000

routing:
  npci:
    base-url: http://localhost:8083
    endpoints:
      ack: /npci/ack
  switch:
    base-url: http://localhost:8082
    socket:
      enabled: true
      host: localhost
      port: 9084
      ssl-enabled: true
      trust-store: E:\Hitachi_Project/IMPS-BACKEND/certs/switch-truststore.jks
      trust-store-password: IMPS-Backend
    rest:
      enabled: false

# ===========================================
# SSL/TLS – NPCI socket server (inbound)
# ===========================================
# ssl.enabled true → NpciSocketServer uses SSLServerSocket on ssl-port (9443)
ssl:
  enabled: true
  key-store: E:\Hitachi_Project/IMPS-BACKEND/certs/imps-keystore.jks
  key-store-password: IMPS-Backend
  key-alias: imps
  trust-store: "file:E:\Hitachi_Project/IMPS-BACKEND/certs/imps-truststore.jks"
  trust-store-password: IMPS-Backend
  client-auth: none   # none | want | need (need = mTLS)

# ===========================================
# SOCKET SERVERS
# ===========================================
# NPCI → IMPS: [4-byte length][XML] on port 9083 / 9443 (ssl.enabled)
# Switch → IMPS (reverse): [4-byte length][ISO] on port 9086 / 9446 (same connection pattern)
socket:
  enabled: true
  server:
    bind-host: 0.0.0.0
    npci:
      port: 9083
      ssl-port: 9443
    switch:
      enabled: true
      port: 9086
      ssl-port: 9446
  max-xml-size: 1048576
  response-timeout-seconds: 60

# ===========================================
# IMPS API & HEARTBEAT
# ===========================================
imps:
  api:
    version: "2.1"
  org-id: "BANK01"
  heartbeat:
    switch-check-enabled: true
    switch-check-interval-ms: 180000
    switch-check-initial-delay-ms: 10000

# ===========================================
# PROFILE: ssl – REST over HTTPS (optional)
# ===========================================
# Use: --spring.profiles.active=ssl
# Switch can POST to https://localhost:8443/imps/{resptype}/{txnId}
---
spring:
  config:
    activate:
      on-profile: ssl
server:
  port: 8443
  ssl:
    enabled: true
    key-store: file:E:\Hitachi_Project/IMPS-BACKEND/certs/imps-keystore.jks
    key-store-password: IMPS-Backend
    key-store-type: JKS
    key-alias: imps
