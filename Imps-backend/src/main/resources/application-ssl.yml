# REST HTTPS profile – use with: --spring.profiles.active=ssl
# Switch can POST to https://localhost:8443/imps/{resptype}/{txnId}
# Run certs/generate-certs.bat first to create imps-keystore.jks

server:
  port: 8443
  ssl:
    enabled: true
    key-store: file:../certs/imps-keystore.jks
    key-store-password: IMPS-Backend
    key-store-type: JKS
    key-alias: imps
