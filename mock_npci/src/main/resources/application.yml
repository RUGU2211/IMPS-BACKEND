# ===========================================
# MOCK NPCI – Application configuration
# ===========================================
# HTTP: port 8083. HTTPS: --spring.profiles.active=ssl → port 8445

server:
  port: 8083

spring:
  application:
    name: mock-npci
  # No database: stateless (receives XML from IMPS, returns ACK)

# ===========================================
# SOCKET SERVER (TCP – length-prefixed XML)
# IMPS connects; mock receives [4-byte length][XML] (RespPay, RespHbt, etc.) and logs to console.
# ===========================================
socket:
  # true = start TCP socket server; false = only REST on server.port
  enabled: true
  # true = listen on ssl-port with TLS; false = plain TCP on port only
  ssl-enabled: true
  server:
    bind-host: 0.0.0.0
    port: 9085        # used when ssl-enabled: false
    ssl-port: 9445    # used when ssl-enabled: true
  ssl:
    key-store: file:E:/Hitachi_Project/certs/npci-keystore.jks
    key-store-password: IMPS-Backend

# ===========================================
# PROFILE: ssl – REST over HTTPS
# ===========================================
# Use: --spring.profiles.active=ssl
# HTTPS REST on port 8445. IMPS POST to https://localhost:8445/npci/{resptype}/{txnId}
---
spring:
  config:
    activate:
      on-profile: ssl
server:
  port: 8445
  ssl:
    enabled: true
    key-store: file:E:/Hitachi_Project/certs/npci-keystore.jks
    key-store-password: IMPS-Backend
    key-store-type: PKCS12
    key-alias: npci

# ===========================================
# PROFILE: docker – cert paths for container
# ===========================================
# Use: java -Dspring.profiles.active=docker -jar app.jar
# Mount certs: -v ./certs:/app/certs
---
spring:
  config:
    activate:
      on-profile: docker
socket:
  ssl:
    key-store: file:/app/certs/npci-keystore.jks
server:
  ssl:
    key-store: file:/app/certs/npci-keystore.jks
