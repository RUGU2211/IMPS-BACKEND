# ===========================================
# MOCK NPCI – Application configuration
# ===========================================
#
# INDEPENDENCE: mock_npci has no outbound dependency on IMPS or mock_switch.
# It only receives connections (socket) and REST calls. Runs standalone; IMPS or Postman may connect.
#
# CONNECTION PORTS (simple reference)
# -----------------------------------
#   IMPS:    HTTP 8081   HTTPS 8443   Socket TCP 9083   Socket TLS 9443
#   Switch:  HTTP 8082   HTTPS 8444   TCP 9084          TLS 9444
#   NPCI:    HTTP 8083   HTTPS 8445   TCP 9085          TLS 9445
# Default: socket uses TLS (ssl-enabled: true). Run from Parent/mock_npci/
#
# Default: HTTPS on 8445 (ssl profile active in application.yml). HTTP 8083: -Dspring.profiles.active=default

server:
  port: 8083

spring:
  application:
    name: mock-npci
  # Default profile: ssl (HTTPS). Use -Dspring.profiles.active= (empty) or "default" for HTTP only.
  profiles:
    active: ssl
  # No database: stateless (receives XML from IMPS, returns ACK)

# ===========================================
# SOCKET SERVER (TCP – length-prefixed XML)
# IMPS connects; mock receives [4-byte length][XML] (RespPay, RespHbt, etc.) and logs to console.
# ===========================================
socket:
  # true = start TCP socket server; false = only REST on server.port
  enabled: true
  # true = listen on ssl-port with TLS; false = plain TCP on port only
  ssl-enabled: true
  server:
    bind-host: 0.0.0.0
    port: 9085        # used when ssl-enabled: false
    ssl-port: 9445    # used when ssl-enabled: true
  ssl:
    key-store: file:${user.dir}/../certs/npci-keystore.jks
    key-store-password: IMPS-Backend

# ===========================================
# PROFILE: ssl – REST over HTTPS
# ===========================================
# Use: --spring.profiles.active=ssl
# HTTPS REST on port 8445. IMPS POST to https://localhost:8445/npci/{resptype}/{txnId}
---
spring:
  config:
    activate:
      on-profile: ssl
server:
  port: 8445
  ssl:
    enabled: true
    key-store: file:${user.dir}/../certs/npci-keystore.jks
    key-store-password: IMPS-Backend
    key-store-type: PKCS12
    key-alias: npci

# ===========================================
# PROFILE: docker – cert paths for container
# ===========================================
# Use: java -Dspring.profiles.active=docker -jar app.jar
# Mount certs: -v ./certs:/app/certs
---
spring:
  config:
    activate:
      on-profile: docker
socket:
  ssl:
    key-store: file:/app/certs/npci-keystore.jks
server:
  ssl:
    key-store: file:/app/certs/npci-keystore.jks
