# ===========================================
# MOCK NPCI – Application configuration
# ===========================================
# All values from .env. Profiles: dev, prod, ssl. Default: prod,ssl
# SPRING_PROFILES_ACTIVE=prod,ssl (default) or dev,ssl (from .env)
# ===========================================

server:
  port: ${SERVER_PORT:8083}

# Default ports: HTTP 8083, HTTPS (ssl) 8445

spring:
  application:
    name: mock-npci
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod,ssl}

# ===========================================
# SOCKET SERVER (TCP – length-prefixed XML)
# IMPS connects; mock receives [4-byte length][XML] (RespPay, RespHbt, etc.) and logs to console.
# ===========================================
socket:
  # true = start TCP socket server; false = only REST on server.port
  enabled: true
  # true = listen on ssl-port with TLS; false = plain TCP on port only
  ssl-enabled: true
  server:
    bind-host: 0.0.0.0
    port: 9085        # used when ssl-enabled: false
    ssl-port: 9445    # used when ssl-enabled: true
  ssl:
    key-store: ${SSL_KEY_STORE:file:${user.dir}/../certs/npci-keystore.jks}
    key-store-password: ${SSL_KEY_STORE_PASSWORD:IMPS-Backend}

# ===========================================
# PROFILE: ssl – REST over HTTPS
# ===========================================
# Combine: dev,ssl or prod,ssl. HTTPS on 8445
---
spring:
  config:
    activate:
      on-profile: ssl
server:
  port: ${SERVER_PORT:8445}
  ssl:
    enabled: true
    key-store: ${SSL_KEY_STORE:file:${user.dir}/../certs/npci-keystore.jks}
    key-store-password: ${SSL_KEY_STORE_PASSWORD:IMPS-Backend}
    key-store-type: PKCS12
    key-alias: npci

# ===========================================
# PROFILE: docker – cert paths for container
# ===========================================
# Use: java -Dspring.profiles.active=docker -jar app.jar
# Mount certs: -v ./certs:/app/certs
---
spring:
  config:
    activate:
      on-profile: docker
socket:
  ssl:
    key-store: file:/app/certs/npci-keystore.jks
server:
  ssl:
    key-store: file:/app/certs/npci-keystore.jks
