# ===========================================
# MOCK SWITCH – Application configuration
# ===========================================

server:
  port: 8082

spring:
  application:
    name: mock-switch
  datasource:
    url: jdbc:postgresql://localhost:5432/switch_db
    username: postgres
    password: root
    hikari:
      housekeeping-run-interval: 10000  # 10s (avoids thread starvation / clock leap when machine sleeps)

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# ===========================================
# IMPS BACKEND ROUTING (for sending responses back to IMPS)
# ===========================================
# Endpoint path is built dynamically: base-path / resptype / txnId
# e.g. base-path: /imps → /imps/resppay/{txnId}, /imps/respchktxn/{txnId}, etc.
imps:
  imps_ip: 192.168.1.38
  imps_port: 8081
  base-path: /imps

# ===========================================
# SOCKET SERVER (TCP – length-prefixed ISO)
# IMPS connects; Switch receives [4-byte length][ISO], responds [4-byte length][ISO] on same connection.
# ===========================================
socket:
  # true = start TCP socket server; false = only REST on server.port
  enabled: true
  # true = listen on ssl-port with TLS; false = plain TCP on port only
  ssl-enabled: true
  server:
    bind-host: 0.0.0.0
    port: 9084        # used when ssl-enabled: false
    ssl-port: 9444    # used when ssl-enabled: true
  ssl:
    key-store: file:../certs/switch-keystore.jks
    key-store-password: IMPS-Backend

# ===========================================
# MOCK BEHAVIOUR
# ===========================================
mock:
  # true = send response automatically after receiving request; false = wait for manual trigger
  auto-respond: true
  response-delay-ms: 500
  default-result: SUCCESS

# ===========================================
# PROFILE: ssl – REST over HTTPS
# ===========================================
# Use: --spring.profiles.active=ssl
# HTTPS REST on port 8444. IMPS/Switch POST to https://localhost:8444/imps/{resptype}/{txnId}
---
spring:
  config:
    activate:
      on-profile: ssl
server:
  port: 8444
  ssl:
    enabled: true
    key-store: file:../certs/switch-keystore.jks
    key-store-password: IMPS-Backend
    key-store-type: JKS
    key-alias: switch
