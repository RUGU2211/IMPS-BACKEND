# ===========================================
# MOCK SWITCH – Application configuration
# ===========================================
# All values from .env. Profiles: dev, prod, ssl. Default: prod,ssl
# SPRING_PROFILES_ACTIVE=prod,ssl (default) or dev,ssl (from .env)
# ===========================================

server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: mock-switch
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod,ssl}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/switch_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    hikari:
      housekeeping-run-interval: 10000

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL:validate}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# ===========================================
# IMPS BACKEND ROUTING CONFIGURATION
# ===========================================
# INDEPENDENCE: Set imps.enabled: false to run mock_switch without IMPS.
# When false: socket and REST still work; only outbound forward to IMPS is skipped (logged).
# Proxy (/switch/proxy/imps/*) returns 503 when imps.enabled: false.
# When true: Switch sends responses to IMPS at imps_ip:imps_port (or imps_ssl_port when ssl).
# Endpoint path is built dynamically: base-path / resptype / txnId
# ===========================================
imps:
  enabled: ${IMPS_ENABLED:true}   # false = run standalone (no outbound calls to IMPS)
  imps_ip: ${IMPS_IP:192.168.1.38}
  imps_port: ${IMPS_PORT:8081}
  imps_ssl_port: ${IMPS_SSL_PORT:8443}  # IMPS HTTPS when ssl profile; used by proxy
  imps_use_ssl: false           # true in ssl profile when IMPS runs with ssl
  base-path: /imps

# ===========================================
# SOCKET SERVER CONFIGURATION
# ===========================================
# Switch listens for incoming socket connections from IMPS
# Protocol: [4-byte length big-endian][ISO 8583 message]
# Response: [4-byte length][ISO 8583 response] on same connection
# ===========================================
socket:
  enabled: true            # true = start TCP socket server; false = only REST
  ssl-enabled: true        # true = listen on ssl-port with TLS; false = plain TCP on port
  server:
    bind-host: 0.0.0.0     # Listen on all interfaces
    port: 9084             # TCP port (used when ssl-enabled: false)
    ssl-port: 9444         # SSL/TLS port (used when ssl-enabled: true)
  ssl:
    key-store: ${SSL_KEY_STORE:file:${user.dir}/../certs/switch-keystore.jks}
    key-store-password: ${SSL_KEY_STORE_PASSWORD:IMPS-Backend}

# ===========================================
# MOCK BEHAVIOUR CONFIGURATION
# ===========================================
mock:
  auto-respond: true
  response-delay-ms: 500
  default-result: SUCCESS

# ===========================================
# PROFILE: ssl – REST over HTTPS (port 8444)
# ===========================================
# Combine: dev,ssl or prod,ssl
---
spring:
  config:
    activate:
      on-profile: ssl
imps:
  imps_use_ssl: true          # Proxy to IMPS over HTTPS (8443)
server:
  port: ${SERVER_PORT:8444}
  ssl:
    enabled: true
    key-store: ${SSL_KEY_STORE:file:${user.dir}/../certs/switch-keystore.jks}
    key-store-password: ${SSL_KEY_STORE_PASSWORD:IMPS-Backend}
    key-store-type: PKCS12
    key-alias: switch

# ===========================================
# PROFILE: docker – cert paths for container
# ===========================================
# Use: java -Dspring.profiles.active=docker -jar app.jar
# Mount certs: -v ./certs:/app/certs
---
spring:
  config:
    activate:
      on-profile: docker
socket:
  ssl:
    key-store: file:/app/certs/switch-keystore.jks
server:
  ssl:
    key-store: file:/app/certs/switch-keystore.jks
