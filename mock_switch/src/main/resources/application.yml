# ===========================================
# MOCK SWITCH – Application Configuration
# ===========================================
# HTTP (default): server.port 8082
# HTTPS: run with --spring.profiles.active=ssl → server.port 8082 (HTTPS)
#
# CONNECTION FLOW EXPLANATION:
# ===========================================
# FLOW 1: IMPS → Switch → IMPS (Request-Response Flow)
# -----------------------------------------------------
# Connection 1: IMPS opens connection to Switch (socket) → sends Req → Switch sends Resp → IMPS closes connection
# Connection 2: Switch opens connection to IMPS (socket) → sends Resp → IMPS sends ACK → Switch closes connection
#
# FLOW 2: Switch → IMPS → Switch (Reverse Flow)
# -----------------------------------------------------
# Connection 1: Switch opens connection to IMPS (socket) → sends Req → IMPS sends Resp → Switch closes connection
# Connection 2: IMPS opens connection to Switch (socket) → sends Resp → Switch sends ACK → IMPS closes connection
#
# IMPORTANT: Each connection is opened, used, and closed immediately after use.
# Connections are NOT reused - new connection is opened for each message exchange.
# ===========================================

# ===========================================
# SERVER CONFIGURATION
# ===========================================
server:
  port: 8082

# ===========================================
# DATABASE CONFIGURATION
# ===========================================
spring:
  application:
    name: mock-switch
  datasource:
    url: jdbc:postgresql://localhost:5432/switch_db
    username: postgres
    password: root
    hikari:
      housekeeping-run-interval: 10000  # 10s (avoids thread starvation when machine sleeps)

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# ===========================================
# LOGGING CONFIGURATION
# ===========================================
logging:
  level:
    org.hibernate.SQL: DEBUG  # Log SQL queries for account_master operations

# ===========================================
# IMPS BACKEND ROUTING CONFIGURATION
# ===========================================
# When Switch needs to send responses back to IMPS Backend
# Endpoint path is built dynamically: base-path / resptype / txnId
# Examples:
#   - base-path: /imps → /imps/resppay/{txnId}
#   - base-path: /imps → /imps/respchktxn/{txnId}
#   - base-path: /imps → /imps/respvaladd/{txnId}
# ===========================================
imps:
  imps_ip: 192.168.1.38
  imps_port: 8081
  base-path: /imps

# ===========================================
# SOCKET SERVER CONFIGURATION
# ===========================================
# Switch listens for incoming socket connections from IMPS
# Protocol: [4-byte length big-endian][ISO 8583 message]
# Response: [4-byte length][ISO 8583 response] on same connection
# ===========================================
socket:
  enabled: true            # true = start TCP socket server; false = only REST
  ssl-enabled: true        # true = listen on ssl-port with TLS; false = plain TCP on port
  server:
    bind-host: 0.0.0.0     # Listen on all interfaces
    port: 9084             # TCP port (used when ssl-enabled: false)
    ssl-port: 9444         # SSL/TLS port (used when ssl-enabled: true)
  ssl:
    key-store: file:E:/Hitachi_Project/certs/switch-keystore.jks
    key-store-password: IMPS-Backend

# ===========================================
# MOCK BEHAVIOUR CONFIGURATION
# ===========================================
mock:
  auto-respond: true
  response-delay-ms: 500
  default-result: SUCCESS

# ===========================================
# PROFILE: ssl – REST over HTTPS (Optional)
# ===========================================
# Use: mvn spring-boot:run -Dspring-boot.run.profiles=ssl
# HTTPS REST on port 8082
# IMPS POST to https://localhost:8082/imps/{resptype}/{txnId}
# ===========================================
---
spring:
  config:
    activate:
      on-profile: ssl
server:
  port: 8082
  ssl:
    enabled: true
    key-store: file:E:/Hitachi_Project/certs/switch-keystore.jks
    key-store-password: IMPS-Backend
    key-store-type: JKS
    key-alias: switch

# ===========================================
# PROFILE: docker – cert paths for container
# ===========================================
# Use: java -Dspring.profiles.active=docker -jar app.jar
# Mount certs: -v ./certs:/app/certs
---
spring:
  config:
    activate:
      on-profile: docker
socket:
  ssl:
    key-store: file:/app/certs/switch-keystore.jks
server:
  ssl:
    key-store: file:/app/certs/switch-keystore.jks
